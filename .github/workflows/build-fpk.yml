name: Build Wild Work FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.2.2)'
        required: true
        default: 'v2.2.2'
      upstream_ref:
        description: 'Upstream git ref (tag/commit)'
        required: true
        default: 'main'

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install ImageMagick (for icon processing)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build FPK package
        run: |
          chmod +x build-fpk.sh
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || 'main' }}"
          bash build-fpk.sh "$VERSION" "$UPSTREAM_REF"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildwork-fpk-${{ github.event.inputs.version || github.ref_name }}
          path: wildwork-*.fpk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: wildwork-*.fpk
          generate_release_notes: true
          draft: false
          prerelease: false
