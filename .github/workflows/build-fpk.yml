name: Build Wild Work FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream release tag (e.g. v2.3.1)'
        required: true
        default: 'v2.3.1'
      upstream_ref:
        # 默认与 version 对齐：按 release tag 检出，不要用 master
        description: 'Upstream git ref (should match the release tag)'
        required: true
        default: 'v2.3.1'
  schedule:
    # 每天 01:00 UTC 检查上游新版本（tag 触发为主，此为兜底）
    - cron: '0 1 * * *'

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    # ★ 必须显式声明：仓库默认 workflow 权限是 read，
    #   不声明则 softprops/action-gh-release 建 release 会被拒（HTTP 403）。
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install ImageMagick (for icon processing)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build FPK package
        run: |
          chmod +x build-fpk.sh
          # 手动触发：直接用输入值
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            UPSTREAM_REF="${{ github.event.inputs.upstream_ref }}"
          else
            # tag 触发（push v*）：github.ref_name 是本仓库的**打包版本 tag**
            # （如 v2.3.1-1），它在上游仓库里并不存在，绝不能拿它去 clone 上游。
            # 约定：打包 tag = 上游 tag + 可选 -N 后缀，去掉 -N 即上游 ref。
            PKG_TAG="${{ github.ref_name }}"
            UPSTREAM_REF="${PKG_TAG%-*}"
            # 防呆：若没有 -N 后缀，则 %-* 不匹配，UPSTREAM_REF 等于 PKG_TAG 本身，
            # 此时它本就应当是一个上游 tag。
            VERSION="$UPSTREAM_REF"
            echo "tag 触发：打包版本=$PKG_TAG，上游 ref=$UPSTREAM_REF"
          fi
          if [ -z "$VERSION" ] || [ -z "$UPSTREAM_REF" ]; then
            echo "FATAL: VERSION / UPSTREAM_REF 解析为空（VERSION='$VERSION' REF='$UPSTREAM_REF'）"
            exit 1
          fi
          bash build-fpk.sh "$VERSION" "$UPSTREAM_REF"
          ls -la wildwork-*.fpk

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildwork-fpk
          path: wildwork-*.fpk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: wildwork-*.fpk
          generate_release_notes: true
          draft: false
          prerelease: false
