name: Build Wild Work FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'fnOS 打包版本（建议 vX.Y.Z-1；tag 触发时自动使用 tag）'
        required: true
        default: 'v2.5.3-1'
      upstream_ref:
        # 打包版本与上游 ref 分开：例如 v2.5.3-1 + v2.5.3
        description: 'Upstream git ref (release tag/commit)'
        required: true
        default: 'v2.5.3'

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    concurrency:
      # ★ 按「打包版本」而不是 github.ref 分组（2026-10-18 修）：
      #   手动 dispatch 的 ref 恒为 refs/heads/main，若按 ref 分组，
      #   不同版本号（如 force_rebuild 的 -3 与 -4）会落进同一组并被 cancel-in-progress
      #   互相取消 —— 表现为「刚点的重打把自己掐了，publish 干等到超时」。
      #   按版本分组后：同版本重复触发仍然取消（幂等），不同版本并行互不干扰。
      group: build-fpk-${{ github.event.inputs.version || github.ref_name }}
      cancel-in-progress: true
    # ★ 必须显式声明：仓库默认 workflow 权限是 read，
    #   不声明则 softprops/action-gh-release 建 release 会被拒（HTTP 403）。
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 敏感信息门禁：放在最前面，命中就 fail ——
      # 这个仓库是公开的，凭据/内网地址一旦进历史就撤不回来。
      # 打包是自动化的，不能指望每次有人手工检查。
      - name: Scan for secrets / private environment info
        run: |
          chmod +x scripts/scan-secrets.sh
          ./scripts/scan-secrets.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # ★ Node/npm 是「Gemini 渠道凭据提取」的依赖（build-fpk.sh 里 npm pack 公开包）。
      #   不显式 setup 就会依赖 runner 预装的 node —— 版本随 ubuntu-latest 镜像漂移，
      #   哪天镜像不带 npm 了，这一步会静默降级成「凭据提取失败、Gemini 不可用」，
      #   而构建仍然成功。显式钉版本，让环境变化以「这里失败」的方式暴露。
      - name: Set up Node (Gemini 凭据提取需要 npm)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ImageMagick (for icon processing)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build FPK package
        run: |
          chmod +x build-fpk.sh
          # 手动触发：直接用输入值
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            UPSTREAM_REF="${{ github.event.inputs.upstream_ref }}"
          else
            # tag 触发（push v*）：github.ref_name 是本仓库的**打包版本 tag**
            # （如 v2.3.1-1），它在上游仓库里并不存在，绝不能拿它去 clone 上游。
            # 约定：打包 tag = 上游 tag + 可选 -N 后缀，去掉 -N 即上游 ref。
            PKG_TAG="${{ github.ref_name }}"
            UPSTREAM_REF="${PKG_TAG%-*}"
            VERSION="$PKG_TAG"
            # 防呆：若没有 -N 后缀，则 %-* 不匹配，UPSTREAM_REF 等于 PKG_TAG 本身，
            # 此时它本就应当是一个上游 tag。
            echo "tag 触发：打包版本=$PKG_TAG，上游 ref=$UPSTREAM_REF"
          fi
          if [ -z "$VERSION" ] || [ -z "$UPSTREAM_REF" ]; then
            echo "FATAL: VERSION / UPSTREAM_REF 解析为空（VERSION='$VERSION' REF='$UPSTREAM_REF'）"
            exit 1
          fi
          bash build-fpk.sh "$VERSION" "$UPSTREAM_REF"
          ls -la wildwork-*.fpk
      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildwork-fpk
          path: wildwork-*.fpk
          retention-days: 30

      - name: Create GitHub Release
        # ★ 只给「重打包序号 tag」（vX.Y.Z-N）用，不给上游版本 tag（vX.Y.Z）用。
        #   原因：Release 是按上游 tag 建的（v2.5.5），而 GitHub 建 Release 时
        #   如果 tag 还不存在会**自动创建它**，该 tag 又匹配本工作流的 `v*` 触发
        #   → 每次自动发布都会多跑一次无用的重复构建（实测 run 63），
        #   还往同一个 Release 里塞一个名字不带 -N 的冗余附件。
        #   上游版本 tag 的附件一律由 check-upstream.yml 的 publish-release.sh 负责。
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v1
        with:
          files: wildwork-*.fpk
          generate_release_notes: true
          draft: false
          prerelease: false
