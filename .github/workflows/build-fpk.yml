name: Build Wild Work FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream release tag (e.g. v2.3.1)'
        required: true
        default: 'v2.3.1'
      upstream_ref:
        # 默认与 version 对齐：按 release tag 检出，不要用 master
        description: 'Upstream git ref (should match the release tag)'
        required: true
        default: 'v2.3.1'
  schedule:
    # 每天 01:00 UTC 检查上游新版本（tag 触发为主，此为兜底）
    - cron: '0 1 * * *'

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install ImageMagick (for icon processing)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build FPK package
        run: |
          chmod +x build-fpk.sh
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # 兜底也按 release tag 检出；check-upstream 会显式传 tag，只有手动触发且
          # 未填时才走这里，此时 VERSION 就是 tag
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || github.event.inputs.version || github.ref_name }}"
          bash build-fpk.sh "$VERSION" "$UPSTREAM_REF"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildwork-fpk
          path: wildwork-*.fpk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: wildwork-*.fpk
          generate_release_notes: true
          draft: false
          prerelease: false
