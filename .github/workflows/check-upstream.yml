name: Check Upstream & Auto-Build

# 每 2 小时检查上游 rockswang/wild-work 的最新 release，
# 发现新版本且本仓库还没有对应产物时，自动触发 build-fpk.yml 打包并发布。
#
# ★ 设计要点（都是踩坑换来的，改前先读）：
#   1. 「判断是否已发布」与「发布」都放在 scripts/ 下的脚本里，不内联在 YAML。
#      YAML 里的 run 体本机跑不了，只能 push 到 CI 试错；抽成脚本后
#      本机用真实 run id 就能验证一遍（见 scripts/README.md）。
#   2. 轮询 build run 必须按「workflow 文件」过滤 + 按时间下界过滤。
#      只筛 event=workflow_dispatch 会把别的运行算进来；而 runs 列表端点会
#      返回陈旧缓存（实测轮询到 9 天前那次成功运行），拿错 run 去下 artifact
#      就会报「包里没有预期文件」。
#   3. build-fpk.yml 有 concurrency cancel-in-progress：短时间内连发两次
#      dispatch，先到的那次会被取消（实测 run 61 cancelled → run 62 success）。
#      所以轮询不能一遇 cancelled 就判失败，要继续等后续运行。
#   4. 发布后必须回读附件并重算哈希 —— 只比 size 字段无法发现上传损坏。

on:
  schedule:
    - cron: '0 */2 * * *'   # 每 2 小时
  workflow_dispatch: {}      # 支持手动立即检查

permissions:
  contents: write
  actions: write

# 本工作流自己串行，避免两次巡检同时进入发布路径
concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get upstream latest release
        id: upstream
        run: |
          set -euo pipefail
          resp=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/rockswang/wild-work/releases/latest)
          tag=$(echo "$resp" | jq -r '.tag_name')
          url=$(echo "$resp" | jq -r '.html_url')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $tag ($url)"

      - name: Decide whether to build (and which package revision)
        id: check
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          base="${tag#v}"
          bash scripts/check-published.sh "$tag" | tee result.txt
          published=$(grep -E '^PUBLISHED=' result.txt | cut -d= -f2)
          max_n=$(grep -E '^MAX_N=' result.txt | cut -d= -f2)
          if [ "$published" = "true" ]; then
            # 已有产物：判定「已构建」。这是幂等判定 —— 巡检每 2 小时跑，
            # 不能每次都重建（重建还可能把修好的版本覆盖回旧内容）。
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "package_version=${base}-${max_n}" >> "$GITHUB_OUTPUT"
            echo "Upstream ${tag} already packaged as wildwork-${base}-${max_n}.fpk -> nothing to do"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "package_version=${base}-1" >> "$GITHUB_OUTPUT"
            echo "No package for upstream ${tag} yet; will build wildwork-${base}-1.fpk"
          fi

      - name: Record dispatch time
        id: t0
        if: steps.check.outputs.build == 'true'
        run: |
          # 减 120s 容差：runner 与 GitHub 的时间戳可能有偏差。
          # publish-release.sh 按「该时刻之后最新的一次 build run」定位，
          # 容差只会让它多等一轮，不会挑错 run（仍按 workflow 文件过滤）。
          echo "epoch=$(( $(date +%s) - 120 ))" >> "$GITHUB_OUTPUT"

      - name: Trigger build workflow
        if: steps.check.outputs.build == 'true'
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-fpk.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"v${{ steps.check.outputs.package_version }}\",\"upstream_ref\":\"${{ steps.upstream.outputs.tag }}\"}}")
          if [ "$code" != "204" ]; then
            echo "::error::Build dispatch failed (HTTP $code)"
            exit 1
          fi
          echo "Build dispatched: upstream ${{ steps.upstream.outputs.tag }} -> v${{ steps.check.outputs.package_version }}"

      - name: Publish release
        id: publish
        if: steps.check.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-release.sh \
            "${{ steps.upstream.outputs.tag }}" \
            "${{ steps.check.outputs.package_version }}" \
            --since "${{ steps.t0.outputs.epoch }}"

      - name: Repair - ensure release carries the asset
        # 即使 check 步骤认为「已发布」，也回读一次是否真带可用附件。
        # 空 Release（只有壳没有附件）是历史 bug，这一步让它自愈。
        # 主路径刚跑过就不重复触发（重复 dispatch 会被 concurrency 互相取消）。
        if: always() && (steps.check.outputs.build != 'true' || steps.publish.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          [ -z "$tag" ] && exit 0
          base="${tag#v}"

          bash scripts/check-published.sh "$tag" | tee repair.txt || true
          if grep -q '^PUBLISHED=true' repair.txt; then
            echo "Upstream ${tag} already has a published package; nothing to repair."
            exit 0
          fi

          echo "::warning::No package found for upstream ${tag} - re-dispatching build to create it"
          since=$(( $(date +%s) - 120 ))
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-fpk.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"v${base}-1\",\"upstream_ref\":\"${tag}\"}}")
          echo "re-dispatch HTTP $code"
          [ "$code" = "204" ] || { echo "::error::repair dispatch failed"; exit 1; }

          bash scripts/publish-release.sh "${tag}" "${base}-1" --since "$since"
