name: Check Upstream & Auto-Build

# 每 2 小时检查上游 rockswang/wild-work 的最新 release，
# 发现新版本且本仓库还没有对应 Release 时，自动触发 build-fpk.yml 打包。

on:
  schedule:
    - cron: '0 */2 * * *'   # 每 2 小时
  workflow_dispatch: {}      # 支持手动立即检查

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get upstream latest release
        id: upstream
        run: |
          resp=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/rockswang/wild-work/releases/latest)
          tag=$(echo "$resp" | jq -r '.tag_name')
          url=$(echo "$resp" | jq -r '.html_url')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $tag ($url)"

      - name: Decide whether to build (and which package revision)
        id: check
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          base="${tag#v}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"

          # 收集「某个 release tag」上所有 wildwork-<base>-N.fpk，输出其中的 N。
          # 注意 tag 命名在历史上**不统一**，两种都要扫，不能猜：
          #   - `v2.5.3`   ：挂在上游 tag 上的 release（自动流水线按此命名）
          #   - `v2.5.3-3` ：独立 release tag（手工重打包时用过，带 v）
          # 早期漏掉 `v` 前缀的写法会 404，静默判成「没构建」→ 反复重建。
          max_n=""
          consider_tag() {
            local rel_tag="$1" got
            got=$(curl -sS "$api/releases/tags/${rel_tag}" -H "$auth" 2>/dev/null \
              | jq -r --arg p "wildwork-${base}-" \
                  '.assets[]? | select(.name | startswith($p)) | .name' 2>/dev/null \
              | sed -n "s/^wildwork-${base}-\([0-9]\+\)\.fpk$/\1/p" \
              | sort -n | tail -1)
            if [ -n "$got" ]; then
              if [ -z "$max_n" ] || [ "$got" -gt "$max_n" ]; then
                max_n="$got"
                echo "  found wildwork-${base}-${got}.fpk on release tag ${rel_tag}"
              fi
            fi
          }

          consider_tag "$tag"        # 上游 tag 名（如 v2.5.3）
          consider_tag "$base"       # 无 v 形态（如 2.5.3）
          for n in $(seq 1 30); do
            consider_tag "${tag}-${n}"   # 带 v 的独立 tag（如 v2.5.3-3）
            consider_tag "${base}-${n}"  # 不带 v 的独立 tag
          done

          if [ -n "$max_n" ]; then
            # 已有产物：判定「已构建」。这是**幂等**判定 —— 巡检每 2 小时跑，
            # 不能每次都重建（重建还可能把修好的版本覆盖回旧内容）。
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "package_version=${base}-${max_n}" >> "$GITHUB_OUTPUT"
            echo "Upstream ${tag} already packaged as wildwork-${base}-${max_n}.fpk -> nothing to do"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "package_version=${base}-1" >> "$GITHUB_OUTPUT"
            echo "No package for upstream ${tag} yet; will build wildwork-${base}-1.fpk"
          fi

      - name: Trigger build workflow
        if: steps.check.outputs.build == 'true'
        run: |
          tag="${{ steps.upstream.outputs.tag }}"
          package_version="${{ steps.upstream.outputs.package_version }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-fpk.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"v${package_version}\",\"upstream_ref\":\"${tag}\"}}")
          if [ "$code" != "204" ]; then
            echo "::error::Build dispatch failed (HTTP $code)"
            exit 1
          fi
          echo "Build dispatched: upstream ${tag} -> v${package_version}"

      - name: Wait for build result and create Release
        if: steps.check.outputs.build == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          package_version="${{ steps.upstream.outputs.package_version }}"
          echo "Waiting for build of ${tag} -> v${package_version} to finish..."

          # 轮询最新一次 run（由上面的 dispatch 触发），最长 10 分钟
          conclusion=""
          run_id=""
          for i in $(seq 1 20); do
            sleep 30
            run=$(curl -sf \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&per_page=1" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
            status=$(echo "$run" | jq -r '.workflow_runs[0].status')
            conclusion=$(echo "$run" | jq -r '.workflow_runs[0].conclusion')
            run_id=$(echo "$run" | jq -r '.workflow_runs[0].id')
            echo "[$i] run $run_id: $status / ${conclusion:-pending}"
            [ "$status" = "completed" ] && break
          done

          if [ "$conclusion" != "success" ]; then
            echo "::error::Build failed for ${tag} (run $run_id, conclusion=$conclusion)"
            exit 1
          fi

          # 从 build run 下载 artifact 里的 fpk
          art=$(curl -sf \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
          art_id=$(echo "$art" | jq -r '.artifacts[0].id')
          if [ -z "$art_id" ] || [ "$art_id" = "null" ]; then
            echo "::error::No artifact found on run $run_id"
            echo "$art" | jq .
            exit 1
          fi
          echo "Downloading artifact $art_id"
          curl -sfL -o artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${art_id}/zip" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          unzip -o artifact.zip
          ls -la *.fpk

          fpk_file=$(ls "wildwork-${package_version}.fpk" 2>/dev/null || true)
          if [ -z "$fpk_file" ]; then
            echo "::error::artifact zip did not contain expected wildwork-${package_version}.fpk"
            ls -la ./*.fpk 2>/dev/null || true
            exit 1
          fi
          SHA=$(sha256sum "$fpk_file" | cut -d' ' -f1)
          echo "FPK: $fpk_file  sha256=$SHA"

          # ★ 幂等：若该上游 tag 的 release 已存在（可能是上次只建了空壳或只有旧包装），直接复用；
          #   build-fpk.yml 只负责 artifact，不负责发布，所以这里必须自己创建/复用 Release。
          rel_json=$(curl -s \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
          rel_id=$(echo "$rel_json" | jq -r '.id // empty')
          if [ -z "$rel_id" ]; then
            body=$(printf '{"tag_name":"%s","name":"Wild Work FPK %s","body":"自动构建于上游 %s (rockswang/wild-work releases)。下载 wildwork-%s.fpk 在飞牛 fnOS 应用中心手动安装。","draft":false,"prerelease":false}' \
              "$tag" "$tag" "$tag" "$package_version")
            resp=$(curl -sS -w '\n%{http_code}' -X POST \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -d "$body")
            code=$(echo "$resp" | tail -1)
            if [ "$code" != "201" ]; then
              echo "::error::create release failed (HTTP $code)"
              echo "$resp" | head -n -1
              exit 1
            fi
            rel_id=$(echo "$resp" | head -n -1 | jq -r '.id')
          else
            echo "Release ${tag} already exists (id=$rel_id), reusing it"
          fi
          [ -n "$rel_id" ] || { echo "::error::Release $tag has no id"; exit 1; }

          if [ -n "$rel_id" ]; then
            existing_asset=$(curl -s \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              | jq -r --arg n "$fpk_file" '.[] | select(.name==$n) | .id')
          else
            existing_asset=""
          fi
          if [ -n "$existing_asset" ]; then
            echo "::warning::Deleting stale asset ${existing_asset} before replacing ${fpk_file}"
            delete_code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
            if [ "$delete_code" != "204" ] && [ "$delete_code" != "404" ]; then
              echo "::error::delete stale asset failed (HTTP $delete_code)"
              exit 1
            fi
          fi

          uploaded=""
          for attempt in 1 2 3 4 5; do
            # ★ Content-Length 必须显式带上：实测不带它时上传流会被中间层改写，
            #   文件静默损坏（7860260 → 7860244 字节），而 API 照样回 201、
            #   state=uploaded，不报任何错。回读比对 size 是唯一的兜底。
            fsize=$(stat -c%s "$fpk_file")
            resp=$(curl -sS -w '\n%{http_code}' -X POST \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets?name=${fpk_file}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              -H "Content-Length: ${fsize}" \
              --data-binary "@${fpk_file}") || true
            code=$(echo "$resp" | tail -1)
            echo "upload attempt $attempt -> HTTP $code"
            if [ "$code" = "201" ]; then
              uploaded=$(echo "$resp" | head -n -1 | jq -r '.browser_download_url')
              break
            fi
            echo "$resp" | head -n -1 | head -c 800; echo
            sleep $((attempt * 10))
          done
          if [ -z "$uploaded" ] || [ "$uploaded" = "null" ]; then
            echo "::error::asset upload failed after 5 attempts for ${tag}"
            exit 1
          fi
          echo "Uploaded: $uploaded"

          # ★ 回读校验：附件必须真的在 release 上（这是唯一可信判据）
          final=$(curl -s \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
          count=$(echo "$final" | jq -r 'length')
          size=$(echo "$final" | jq -r --arg n "$fpk_file" '.[] | select(.name==$n) | .size')
          if [ -z "$size" ] || [ "$size" = "null" ]; then
            echo "::error::post-upload verification failed: ${fpk_file} not on release ${tag}"
            echo "$final" | jq .
            exit 1
          fi
          echo "VERIFIED: ${tag} assets=${count} ${fpk_file} size=${size} (local $(stat -c%s "$fpk_file"))"
          if [ "$size" != "$(stat -c%s "$fpk_file")" ]; then
            echo "::error::uploaded size mismatch for ${fpk_file}"
            exit 1
          fi

          echo "Release ready: ${tag} -> ${fpk_file} sha256=${SHA}"

      - name: Repair - ensure release carries the asset
        # 即使 check 步骤认为「已构建」，也回读一次 release 是否真带附件。
        # 空 release（只有壳没有附件）是历史 bug，这一步让它自愈。
        if: always()
        run: |
          set -uo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          [ -z "$tag" ] && exit 0
          base="${tag#v}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"

          # 统计该上游 tag 名下到底有没有任何产物。
          # tag 命名历史上不统一（`v2.5.3` 与 `v2.5.3-3` 都存在过），
          # 所以两种形态都要扫 —— 只扫一种会把「其实已有包」误判成空壳、
          # 进而反复重建（重建还可能覆盖掉修好的版本）。
          found=""
          check_tag() {
            local rel_tag="$1" c
            c=$(curl -sS "$api/releases/tags/${rel_tag}" -H "$auth" 2>/dev/null \
              | jq -r --arg p "wildwork-${base}-" \
                  '[.assets[]? | select(.name | startswith($p))] | length' 2>/dev/null)
            if [ -n "$c" ] && [ "$c" != "0" ] && [ "$c" != "null" ]; then
              echo "Package found on release tag ${rel_tag}: ${c} asset(s)"
              found=1
            fi
          }
          check_tag "$tag"
          check_tag "$base"
          for n in $(seq 1 30); do
            [ -n "$found" ] && break
            check_tag "${tag}-${n}"
            check_tag "${base}-${n}"
          done
          if [ -n "$found" ]; then
            echo "Upstream ${tag} already has a published package; nothing to repair."
            exit 0
          fi

          echo "::warning::No package found for upstream ${tag} - re-dispatching build to create it"
          # ★ version 必须是 <base>-1（带 -N 后缀），与 check 步骤判据一致。
          #   早期这里传的是上游 tag 本身，build-fpk.sh 会产出 wildwork-<base>.fpk，
          #   与判据 wildwork-<base>-1.fpk 永远对不上 → Repair 反复触发却永远修不好。
          curl -s -X POST \
            "$api/actions/workflows/build-fpk.yml/dispatches" \
            -H "$auth" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"v${base}-1\",\"upstream_ref\":\"${tag}\"}}" \
            -w 're-dispatch HTTP %{http_code}\n'